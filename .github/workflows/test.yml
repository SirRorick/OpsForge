name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test

      # dist/ is generated; make sure it was rebuilt after src/ changed.
      - name: Check dist is up to date
        run: |
          npm run build
          git diff --exit-code dist/
        shell: bash
